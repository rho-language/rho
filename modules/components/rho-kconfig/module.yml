module:
  name: rho-kconfig
  type: component
  version: 0.1.0
  author: Aurel Miron
  description: Configuration bridge between a Rho project and the Kconfig tooling around it
  command: kconfig
  import_path: rho.kconfig

main: rho-kconfig

features:
  - configuration
  - kconfig
  - embedded

# A Rho program reads a generated configuration through this library, so a value
# chosen at build time is visible to code that runs.
package:
  kind: component
  binary: true
  import_path: rho.kconfig
  interface:
    - src/kconfig.rho
  include:
    - module.yml
    - README.md
    - docs
    - src
  require:
    - module.yml
    - README.md
    - src

# The hook a build goes through. A dialect is the part that differs between the
# tools that read a configuration, so it is the part worth extending: a plugin
# answers `render` with files, and they are written beside the dialect's own.
#
# `platform` is the contract a platform plugin fills: the configuration fragments
# and values a platform's build needs, rendered into the files its toolchain
# reads, so that supporting a platform is a plugin rather than a dialect written
# into this component.
provides:
  hooks:
    - render
  contracts:
    - name: platform
      description: Renders the configuration files a platform's build reads.
      one: true
      hooks: [render]

docs:
  title: Configuration bridge
  section: components
  order: "50"
  index: docs/index.md
  sources:
    - docs/index.md
