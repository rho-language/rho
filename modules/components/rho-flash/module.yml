#
# rho-flash — put a built binary on the board.
#
# What a board needs to be flashed is not a property of the flasher. OpenOCD,
# st-flash, picotool and dfu-util each want a different invocation, and which one
# is right depends on the part, the probe and what the board has soldered on it.
# So the platform says: a target spec carries a `flash` block naming the tool and
# the command, and this program runs it. That is one description of a board
# rather than one in the spec the build read and another in the flasher, and it
# is why the program reads the spec through rho-target instead of parsing it.
#
# It used to carry a switch over MCU names instead, with the tool and the load
# address written into the program. The address in particular was a constant here
# that the memory map already knew.
#
# The command is `flash` and nothing else: a build already produces the binary,
# and this is what puts it on the board.
#
# @project Rho Programming Language
# @license Apache-2.0
#

module:
  name: rho-flash
  type: component
  version: 0.1.3
  author: Aurel Miron
  description: Puts a built binary on a board, using the command its target spec declares
  command: flash

main: rho-flash

features:
  - flash
  - openocd
  - stlink
  - board

# The hook a flash goes through, and the contract a platform plugin fills.
#
# A board's own target spec says how it is reached, and this component runs it.
# A platform whose boards are reached in a way a spec cannot state — a tool
# chosen from what is installed, an address the platform computes — says so
# through this hook, so the platform's peculiarity is a plugin rather than a
# switch over part numbers in this component.
provides:
  hooks:
    - flash
  contracts:
    - name: platform
      description: Supplies the command a platform's board is programmed with.
      one: true
      hooks: [flash]

# What this module is for, in the form the documentation generator reads.
# A module that says nothing here is still documented — the README it
# published is read — but a module that says so is addressed by its own
# name, which is what lets another page link to it.
docs:
  title: Flashing a board
  section: components
  order: "55"
  index: docs/index.md
  sources:
    - docs/index.md

package:
  kind: component
  binary: true
  include:
    - module.yml
    - README.md
    - CHANGELOG.md
    - src
  require:
    - module.yml
    - README.md
    - src
