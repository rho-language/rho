module:
  name: rho-cimport
  type: component
  version: 0.1.0
  description: Generates a Rho foreign interface from C headers, and the C that Rho cannot express
  command: cimport
  import_path: rho.cimport

main: rho-cimport

features:
  - ffi
  - c
  - codegen

# It reads a project's manifest, and it logs through the shared logger so a
# generation is identifiable in a shared log.
deps:
  rho-log: ">=0.1.0"

package:
  kind: component
  binary: true
  import_path: rho.cimport
  interface:
    - src/cimport.rho
  include:
    - module.yml
    - README.md
    - docs
    - src
  require:
    - module.yml
    - README.md
    - src

# The hook a generation goes through. A library's own types are the thing a
# generator cannot know, so a plugin answers `map` with the mappings for them.
provides:
  hooks:
    - map

docs:
  title: C import bridge
  section: components
  order: "60"
  index: docs/index.md
  sources:
    - docs/index.md
