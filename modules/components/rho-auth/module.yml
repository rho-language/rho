module:
  name: rho-auth
  type: component
  version: 0.5.0
  author: Aurel Miron
  description: Credentials and tokens — registry logins, signing keys, tickets, people, clients and service tokens
  command: auth

main: rho-auth

features:
  - auth
  - credentials

# The command logs through the shared logger, so a login is identifiable in a
# shared log without every line having to say so.
deps:
  rho-log: ">=0.1.0"

# What this module is for, in the form the documentation generator reads.
# A module that says nothing here is still documented — the README it
# published is read — but a module that says so is addressed by its own
# name, which is what lets another page link to it.
docs:
  title: Registry credentials
  section: components
  order: "65"
  index: docs/index.md
  sources:
    - docs/index.md

