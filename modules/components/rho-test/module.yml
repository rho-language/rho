module:
  name: rho-test
  type: component
  version: 0.1.0
  author: Aurel Miron
  description: Test runner
  command: test

main: rho-test

features:
  - test
  - discovery

# The runner logs through the shared logger, so a test run carries its own
# component name rather than an unlabelled line.
deps:
  rho-log: ">=0.1.0"

# The hooks a run goes through, which a plugin answers. A plugin is a third
# party's answer to a question about a test run, so the two questions worth
# asking are the ones only a project can answer: what a run found, and how a
# result should be reported.
provides:
  # Two contracts rather than one, because discovering a project's tests and
  # reporting a finished run are unrelated jobs, and a plugin that only reports
  # is not a plugin that discovers.
  contracts:
    - name: discover
      description: Finds the tests a run will execute.
      one: false
      hooks: [discover]
    - name: report
      description: Reports a finished run in a form a system reads.
      one: false
      hooks: [run]
  hooks:
    # Once, over what the project's manifest declared: a plugin that knows a
    # framework answers with the suites of that kind, each with the steps that
    # build and run it. This is how a framework the runner does not implement is
    # reached — the runner asks, and a plugin that knows gtest says how.
    - discover
    # Once, over the results of a finished run, with the suites that were
    # considered and what was skipped: a plugin that reports a run in a form a
    # system reads, such as JUnit XML or a CI summary.
    - run

# What a run can do by itself, and what it asks a plugin for.
#
# The kinds here are the ones the runner knows how to run, and a kind is what
# decides who does that — not what class of test a suite is. Which class it is is
# a tag, and tags are the project's own vocabulary.
#
#   rho       a Rho test file, translated, compiled and run
#   command   a command the project can already run by hand
#
# Anything else is a kind somebody else's plugin answers for: gtest is the one
# the toolchain ships. A kind that is declared and has no runner is skipped with
# a reason rather than dropped, because a run that passed while a declared test
# went unrun is the outcome this runner exists to prevent.

# The runner documents itself: what it discovers, and what it reports.
docs:
  title: Test runner
  section: components
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md
