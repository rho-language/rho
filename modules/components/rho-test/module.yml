module:
  name: rho-test
  type: component
  version: 0.1.0
  author: Aurel Miron
  description: Test runner
  command: test

main: rho-test

features:
  - test
  - discovery

# The runner logs through the shared logger, so a test run carries its own
# component name rather than an unlabelled line.
deps:
  rho-log: ">=0.1.0"

# The hooks a run goes through, which a plugin answers. A plugin is a third
# party's answer to a question about a test run, so the two questions worth
# asking are the ones only a project can answer: what a run found, and how a
# result should be reported.
provides:
  # Two contracts rather than one, because discovering a project's tests and
  # reporting a finished run are unrelated jobs, and a plugin that only reports
  # is not a plugin that discovers.
  contracts:
    - name: discover
      description: Finds the tests a run will execute.
      one: false
      hooks: [discover]
    - name: report
      description: Reports a finished run in a form a system reads.
      one: false
      hooks: [run]
  hooks:
    # Once, over the test files the run found: a plugin that knows a project's
    # own test layout, or that generates tests, answers here.
    - discover
    # Once, over the results of a finished run: a plugin that reports a run
    # in a form a system reads, such as JUnit XML or a CI summary.
    - run

# The runner documents itself: what it discovers, and what it reports.
docs:
  title: Test runner
  section: components
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md
