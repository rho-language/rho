module:
  name: rho-log
  type: component
  version: 0.1.1
  author: Aurel Miron
  description: Structured logging
  command: log
  import_path: rho.log

main: rho-log

# The component is published as a command and, in the same structure, as a Rho
# library: src/log.rho is imported as `rho.log` by anything that depends on it.
# Setting binary to false publishes the library form, the way a C project with
# no main is built as a library rather than an executable.
package:
  kind: component
  # The command form carries the whole component. The library form is the
  # header alone: src/log.rho declares what a caller compiles against, and the
  # implementation comes from the logemit port, so no host source travels.
  binary: true
  import_path: rho.log
  interface:
    - src/log.rho
  include:
    - module.yml
    - README.md
    - docs
    - src
  require:
    - module.yml
    - README.md
    - src

features:
  - logging
  - structured

# The record format is the shared contract between a device writing to a serial
# console and a server writing to stdout, so the formatter lives in its own
# component rather than being copied in here.
deps:
  rho-fmt: ">=0.1.0"

# The logger documents itself: the sources below are what a component that
# depends on it is pointed at.
docs:
  title: Structured logging
  section: components
  order: "20"
  index: docs/index.md
  sources:
    - docs/index.md
