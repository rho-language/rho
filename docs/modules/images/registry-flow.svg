<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="title">The remote and the local registry</title>
  <desc id="desc">Publishing a module's source tree uploads it to the remote registry when logged in and installs it into the local registry; publish --local only installs it. rho module install fetches a version from the remote registry into modules/installed. activate changes which version the index in registry/local/registry.yaml selects. enable writes modules/enabled.yml, which is what rho commands, plugin discovery and builds read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Source tree -->
  <rect x="20" y="190" width="160" height="76" rx="8" fill="#1e293b" stroke="#0f172a"/>
  <text x="100" y="215" text-anchor="middle" fill="#f8fafc" font-weight="600">A module's source</text>
  <text x="100" y="236" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">module.yml</text>
  <text x="100" y="254" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">CHANGELOG.md, src/</text>

  <!-- Remote registry -->
  <rect x="260" y="30" width="580" height="96" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="280" y="56" fill="#0f172a" font-weight="600" font-size="14">A remote registry</text>
  <text x="280" y="78" fill="#334155">registry.rho-lang.org, or one you run · named in ~/.rho/config/registry.yaml</text>
  <text x="280" y="99" fill="#334155">an owner per name, from the publishing credential · public or private</text>
  <text x="280" y="117" fill="#334155">a digest per version, and a signature when the publisher has a key</text>

  <!-- Local registry container -->
  <rect x="260" y="200" width="580" height="250" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="280" y="226" fill="#0f172a" font-weight="600" font-size="14">The local registry</text>
  <text x="280" y="244" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">~/.rho</text>

  <rect x="280" y="290" width="170" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="365" y="313" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">modules/installed/</text>
  <text x="365" y="335" text-anchor="middle" fill="#0f172a" font-weight="600">available</text>
  <text x="365" y="352" text-anchor="middle" fill="#334155" font-size="12">every installed version</text>

  <rect x="465" y="290" width="170" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="550" y="313" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">registry.yaml</text>
  <text x="550" y="335" text-anchor="middle" fill="#0f172a" font-weight="600">selected</text>
  <text x="550" y="352" text-anchor="middle" fill="#334155" font-size="12">one version, and its origin</text>

  <rect x="650" y="290" width="170" height="72" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="735" y="313" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">modules/enabled.yml</text>
  <text x="735" y="335" text-anchor="middle" fill="#0f172a" font-weight="600">runs</text>
  <text x="735" y="352" text-anchor="middle" fill="#334155" font-size="12">one version, or none</text>

  <rect x="560" y="392" width="260" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="690" y="412" text-anchor="middle" fill="#0f172a" font-size="12">rho &lt;command&gt;, a component's plugins</text>
  <text x="690" y="429" text-anchor="middle" fill="#0f172a" font-size="12">and a build's installed dependencies</text>

  <!-- publish: source -> remote -->
  <path d="M180,200 C220,170 225,90 258,80" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="140" y="128" width="104" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="192" y="143" text-anchor="middle" fill="#334155" font-size="12">publish (upload)</text>

  <!-- publish: source -> installed -->
  <path d="M180,250 C230,262 250,318 278,322" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="96" y="286" width="138" height="38" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="165" y="301" text-anchor="middle" fill="#334155" font-size="12">publish installs here;</text>
  <text x="165" y="317" text-anchor="middle" fill="#334155" font-size="12">--local only does this</text>

  <!-- install: remote -> installed -->
  <line x1="432" y1="126" x2="432" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="150" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="165" text-anchor="middle" fill="#334155" font-size="12">install &lt;name&gt;</text>

  <!-- activate -> registry.yaml -->
  <rect x="505" y="236" width="90" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="251" text-anchor="middle" fill="#334155" font-size="12">activate</text>
  <line x1="550" y1="258" x2="550" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- enable -> enabled.yml -->
  <rect x="690" y="236" width="90" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="735" y="251" text-anchor="middle" fill="#334155" font-size="12">enable</text>
  <line x1="735" y1="258" x2="735" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- enabled -> readers -->
  <line x1="735" y1="362" x2="735" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
