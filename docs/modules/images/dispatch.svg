<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="title">How rho reaches a component, and how a component reaches its plugins</title>
  <desc id="desc">Left: rho fmt is not a built-in, so rho finds the installed module whose manifest declares command fmt, checks that this version is the enabled one, and runs its binary; a version that is not enabled is refused. Right: the rho-doc component reaches its index hook, the plugin source finds the enabled plugins that extend rho-doc and serve the project's platform, and each answering command is run with a JSON request on standard input and answers with JSON on standard output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Panel titles -->
  <rect x="35" y="14" width="250" height="26" rx="13" fill="#334155"/>
  <text x="160" y="32" text-anchor="middle" fill="#f8fafc" font-weight="600">rho &lt;command&gt; → a component</text>
  <rect x="455" y="14" width="250" height="26" rx="13" fill="#334155"/>
  <text x="580" y="32" text-anchor="middle" fill="#f8fafc" font-weight="600">a component → its plugins</text>

  <!-- Left panel -->
  <rect x="35" y="60" width="380" height="44" rx="8" fill="#1e293b" stroke="#0f172a"/>
  <text x="55" y="87" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ rho fmt .</text>

  <line x1="225" y1="104" x2="225" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="35" y="130" width="380" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="225" y="153" text-anchor="middle" fill="#0f172a" font-weight="600">Not a built-in (build, module, env, …)</text>
  <text x="225" y="173" text-anchor="middle" fill="#334155">and the local registry exists in ~/.rho</text>

  <line x1="225" y1="186" x2="225" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="35" y="212" width="380" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="225" y="235" text-anchor="middle" fill="#0f172a" font-weight="600">Find the manifest that says command: fmt</text>
  <text x="225" y="255" text-anchor="middle" fill="#334155">modules/installed/{component,plugin}/*/module.yml</text>

  <line x1="225" y1="268" x2="225" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="35" y="294" width="380" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="225" y="317" text-anchor="middle" fill="#0f172a" font-weight="600">Is this version the enabled one?</text>
  <text x="225" y="337" text-anchor="middle" fill="#334155">~/.rho/modules/enabled.yml</text>

  <path d="M145,350 L145,398" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="127" y="362" width="36" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="376" text-anchor="middle" fill="#334155" font-size="12">yes</text>

  <path d="M345,350 L345,398" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="329" y="362" width="32" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="345" y="376" text-anchor="middle" fill="#334155" font-size="12">no</text>

  <rect x="35" y="400" width="230" height="76" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="150" y="423" text-anchor="middle" fill="#0f172a" font-weight="600">Run &lt;module root&gt;/&lt;main&gt;</text>
  <text x="150" y="443" text-anchor="middle" fill="#334155">with its arguments, and</text>
  <text x="150" y="463" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RHO_MODULE_ROOT</text>

  <rect x="280" y="400" width="135" height="76" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="347" y="423" text-anchor="middle" fill="#0f172a" font-weight="600">Refused</text>
  <text x="347" y="443" text-anchor="middle" fill="#334155" font-size="12">enable it with</text>
  <text x="347" y="461" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">rho module enable</text>

  <!-- Right panel -->
  <rect x="455" y="60" width="370" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="640" y="83" text-anchor="middle" fill="#0f172a" font-weight="600">rho-doc (component)</text>
  <text x="640" y="103" text-anchor="middle" fill="#334155">reaches its index hook</text>

  <line x1="640" y1="116" x2="640" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="455" y="150" width="370" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="173" text-anchor="middle" fill="#0f172a" font-weight="600">The plugin source</text>
  <text x="640" y="194" text-anchor="middle" fill="#334155">installed plugins whose enabled version</text>
  <text x="640" y="212" text-anchor="middle" fill="#334155">extends rho-doc, tree plugins only if trusted,</text>
  <text x="640" y="230" text-anchor="middle" fill="#334155">and only those serving the project's platform</text>

  <line x1="600" y1="246" x2="600" y2="298" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="490" y="262" width="110" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="545" y="277" text-anchor="middle" fill="#334155" font-size="12">request on stdin</text>

  <line x1="690" y1="298" x2="690" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="696" y="262" width="124" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="758" y="277" text-anchor="middle" fill="#334155" font-size="12">response on stdout</text>

  <rect x="455" y="300" width="370" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="640" y="323" text-anchor="middle" fill="#0f172a" font-weight="600">rho-doc-toc (plugin)</text>
  <text x="640" y="343" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">extends: rho-doc  implements: [contents]</text>
  <text x="640" y="362" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">hooks: [index, page]</text>

  <line x1="640" y1="376" x2="640" y2="410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="650" y="383" width="160" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="730" y="398" text-anchor="middle" fill="#334155" font-size="12">checked by validate</text>

  <rect x="455" y="412" width="370" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="640" y="435" text-anchor="middle" fill="#0f172a" font-weight="600">What rho-doc provides</text>
  <text x="640" y="456" text-anchor="middle" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">hooks: [index, page]  contract: contents</text>
</svg>
