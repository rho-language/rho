<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">What rho build does</title>
  <desc id="desc">Rho sources go through the front end (lexer, parser, type checker) to the IR. A backend per declared target writes a generated project under build/generated/&lt;target&gt;: the C backend a CMake project that rho-target builds with its toolchain and target CMake files into build/output/&lt;name&gt;; the Go backend a Go command or a Go web service that go build turns into build/&lt;name&gt;.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .box   { stroke: #6b7280; stroke-width: 1.25; }
      .front { fill: #e0e7ff; }
      .back  { fill: #dcfce7; }
      .gen   { fill: #fef3c7; }
      .tool  { fill: #f3f4f6; }
      .out   { fill: #e5e7eb; }
      .t     { fill: #111827; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .s     { fill: #374151; font-size: 11px; text-anchor: middle; }
      .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cap   { fill: #6b7280; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-anchor: middle; }
      .line  { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Top row: one program, compiled once -->
  <rect class="box front" x="100" y="20" width="150" height="64" rx="8"/>
  <text class="t" x="175" y="47">.rho sources</text>
  <text class="s" x="175" y="66">its modules too</text>

  <rect class="box front" x="290" y="20" width="210" height="64" rx="8"/>
  <text class="t" x="395" y="47">Front end</text>
  <text class="s" x="395" y="66">lexer · parser · type checker</text>

  <rect class="box front" x="540" y="20" width="130" height="64" rx="8"/>
  <text class="t" x="605" y="47">IR</text>
  <text class="s" x="605" y="66">typed and checked</text>

  <path class="line" d="M250,52 H286" marker-end="url(#arrow)"/>
  <path class="line" d="M500,52 H536" marker-end="url(#arrow)"/>

  <!-- Fan out: one backend per declared target -->
  <path class="line" d="M605,84 V110 H10 V396"/>
  <path class="line" d="M10,186 H20" marker-end="url(#arrow)"/>
  <path class="line" d="M10,291 H20" marker-end="url(#arrow)"/>
  <path class="line" d="M10,396 H20" marker-end="url(#arrow)"/>

  <text class="cap" x="97" y="138">BACKEND</text>
  <text class="cap" x="296" y="138">BUILD/GENERATED/&lt;TARGET&gt;</text>
  <text class="cap" x="507" y="138">BUILT WITH</text>
  <text class="cap" x="679" y="138">PROGRAM</text>

  <!-- Row 1: c -->
  <rect class="box back" x="24" y="150" width="146" height="72" rx="8"/>
  <text class="t" x="97" y="181">C backend</text>
  <text class="s" x="97" y="200">target c</text>

  <rect class="box gen" x="196" y="150" width="200" height="72" rx="8"/>
  <text class="t m" x="296" y="181" style="font-size:12px">build/generated/c/</text>
  <text class="s" x="296" y="200">CMakeLists.txt · app.c · main.c</text>

  <rect class="box tool" x="422" y="150" width="170" height="72" rx="8"/>
  <text class="t" x="507" y="176">cmake</text>
  <text class="s" x="507" y="195">run by rho-target</text>
  <text class="s" x="507" y="210">+ toolchain, target .cmake</text>

  <rect class="box out" x="618" y="150" width="122" height="72" rx="8"/>
  <text class="t m" x="679" y="181" style="font-size:12px">build/output/</text>
  <text class="s m" x="679" y="200">&lt;name&gt;</text>

  <path class="line" d="M170,186 H192" marker-end="url(#arrow)"/>
  <path class="line" d="M396,186 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M592,186 H614" marker-end="url(#arrow)"/>

  <!-- Row 2: go -->
  <rect class="box back" x="24" y="255" width="146" height="72" rx="8"/>
  <text class="t" x="97" y="286">Go backend</text>
  <text class="s" x="97" y="305">target go · kind cli</text>

  <rect class="box gen" x="196" y="255" width="200" height="72" rx="8"/>
  <text class="t m" x="296" y="286" style="font-size:12px">build/generated/go/</text>
  <text class="s" x="296" y="305">main.go · app.go · go.mod</text>

  <rect class="box tool" x="422" y="255" width="170" height="72" rx="8"/>
  <text class="t" x="507" y="286">go build</text>
  <text class="s" x="507" y="305">a command</text>

  <rect class="box out" x="618" y="255" width="122" height="72" rx="8"/>
  <text class="t m" x="679" y="286" style="font-size:12px">build/</text>
  <text class="s m" x="679" y="305">&lt;name&gt;</text>

  <path class="line" d="M170,291 H192" marker-end="url(#arrow)"/>
  <path class="line" d="M396,291 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M592,291 H614" marker-end="url(#arrow)"/>

  <!-- Row 3: go-server -->
  <rect class="box back" x="24" y="360" width="146" height="72" rx="8"/>
  <text class="t" x="97" y="391">Go backend</text>
  <text class="s" x="97" y="410">go-server · kind server</text>

  <rect class="box gen" x="196" y="360" width="200" height="72" rx="8"/>
  <text class="t m" x="296" y="391" style="font-size:12px">build/generated/go-server/</text>
  <text class="s" x="296" y="410">server.go · ports.go · static/</text>

  <rect class="box tool" x="422" y="360" width="170" height="72" rx="8"/>
  <text class="t" x="507" y="391">go build</text>
  <text class="s" x="507" y="410">an HTTP service</text>

  <rect class="box out" x="618" y="360" width="122" height="72" rx="8"/>
  <text class="t m" x="679" y="391" style="font-size:12px">build/</text>
  <text class="s m" x="679" y="410">&lt;name&gt;</text>

  <path class="line" d="M170,396 H192" marker-end="url(#arrow)"/>
  <path class="line" d="M396,396 H418" marker-end="url(#arrow)"/>
  <path class="line" d="M592,396 H614" marker-end="url(#arrow)"/>
</svg>
