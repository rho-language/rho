#
# bench-crc-rho — a CRC-32 benchmark written in Rho.
#
# The same program as examples/bench-crc/c, written in Rho. Both compute
# CRC-32 over a 1 KiB buffer 10000 times, to exercise the CPU without any
# platform-specific code.
#
# @project Rho Programming Language
# @license Apache-2.0
#

module:
  name: bench-crc-rho
  type: rho
  version: 0.1.0
  description: >
    CRC-32 benchmark in Rho, for comparing generated code size and runtime
    against the same program written in C.

  maintainer: "Aurel Miron"
  license: "Apache-2.0"
  created: "2026-10-05"

main: src/main.rho

build:
  language: c
  output_dir: output
  targets:
    - c
