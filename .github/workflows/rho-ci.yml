name: Rho CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run Go tests
      run: go test ./...

    - name: Build Go tools
      run: go build ./...

    # A component and a plugin is its own Go module, so the root module's
    # `go build ./...` and `go test ./...` do not reach it. Every module in the
    # repository is built and tested here, so a component cannot pass CI
    # untested: the toolchain, the formatter, the logger, the test runner and
    # the documentation generator all live in one of these trees.
    - name: Build and test the modules
      run: |
        for module in modules/components/*/ modules/plugins/*/; do
          if [ -f "$module/go.mod" ]; then
            echo "::group::$module"
            (cd "$module" && go build ./... && go test ./...)
            echo "::endgroup::"
          fi
        done

    # Installing a module makes it available; using it is a separate decision,
    # and a module that is not enabled is not used. A machine that means to run
    # something therefore has to say so, and this is where CI says it.
    #
    # The registry's tests need the SQL component and the sqlite engine, and skip
    # without them. Enabling both here means they run rather than skip, which is
    # the difference between a registry whose records are checked and one that is
    # only built.
    - name: Enable the modules the tests need
      run: |
        go build -o ./bin/rho ./cmd/rho
        for module in modules/components/*/ modules/plugins/*/; do
          if [ -f "$module/module.yml" ]; then
            name=$(awk '/^  name: /{print $2; exit}' "$module/module.yml")
            case "$name" in
              rho-sql|rho-doc|rho-test|rho-router|rho-auth|rho-log|rho-openapi|rho-fmt|rho-cimport|rho-kconfig|rho-lsp|rho-target)
                ./bin/rho module enable "$name" || true
                ;;
            esac
          fi
        done
        ./bin/rho plugin enable rho-sql-sqlite || true
        ./bin/rho plugin enable rho-doc-toc || true
        ./bin/rho plugin enable rho-doc-api || true
        ./bin/rho plugin enable rho-test-junit || true

    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_TESTING=ON

    - name: Build CMake target
      run: cmake --build build --parallel

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure
