name: Rho CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run Go tests
      run: go test ./...

    - name: Build Go tools
      run: go build ./...

    # A component and a plugin is its own Go module, so the root module's
    # `go build ./...` and `go test ./...` do not reach it. Every module in the
    # repository is built and tested here, so a component cannot pass CI
    # untested: the toolchain, the formatter, the logger, the test runner and
    # the documentation generator all live in one of these trees.
    - name: Build and test the modules
      run: |
        for module in modules/components/*/ modules/plugins/*/; do
          if [ -f "$module/go.mod" ]; then
            echo "::group::$module"
            (cd "$module" && go build ./... && go test ./...)
            echo "::endgroup::"
          fi
        done

    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_TESTING=ON

    - name: Build CMake target
      run: cmake --build build --parallel

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure
