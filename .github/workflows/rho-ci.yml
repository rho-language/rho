name: Rho CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    # Build, publish, install, test — in that order, and by the script in the
    # repository rather than by steps written out here.
    #
    # The order is not tidiness. A component and a plugin is a separate Go module
    # that the toolchain runs as a program, so a test that builds a program needs
    # rho-target, rho-cimport and rho-kconfig installed in the local registry and
    # enabled. This workflow used to run `go test ./...` first and enable the
    # modules afterwards, and so failed three tests with
    #
    #     this build needs the rho-target component: module not installed
    #
    # — a true statement about the runner and a useless one about the code. The
    # steps that came after could not rescue it: the tests had already run.
    #
    # The hand-written list of components to enable is gone for the same reason.
    # `scripts/check.sh` publishes every module the tree carries at the version its own
    # manifest declares, which is also what stops that list going stale — and what
    # lets a module added to the tree be tested without this file being edited.
    - name: Check
      run: ./scripts/check.sh

    # The race detector over the packages that download, unpack and serve. They
    # are the ones with goroutines and with untrusted input, and a race there is a
    # security bug as often as a correctness one. After the check, for the same
    # reason the CMake build is: it needs the components the check installed.
    - name: Race detector
      run: go test -race -count=1 ./cmd/... ./src/plugins/... ./src/privilege/...

    # Known vulnerabilities in what the toolchain is built from. Failing here is
    # the point: a dependency with a published advisory is a decision to make, not
    # a thing to find out about from somebody else.
    - name: Vulnerability scan
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # The CMake build on top: the Go toolchain through CMake, which is how the
    # project is packaged, and the CTest suite it registers.
    #
    # After the check rather than instead of it, because `configureAndBuild` runs
    # the Go toolchain to produce a project and that toolchain dispatches to the
    # components `scripts/check.sh` has just installed.
    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_TESTING=ON

    - name: Build CMake target
      run: cmake --build build --parallel

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure
