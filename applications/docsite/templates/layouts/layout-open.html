<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        color-scheme: light dark;
        --ink: #171a1d;
        --muted: #5c646c;
        --faint: #868d94;
        --line: #e4e7ea;
        --panel: #f6f7f8;
        --canvas: #ffffff;
        --accent: #0d6e63;
        --accent-wash: #0d6e630f;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8eaec;
          --muted: #a2a9b0;
          --faint: #7d848b;
          --line: #272d33;
          --panel: #14181c;
          --canvas: #0d1013;
          --accent: #5eead4;
          --accent-wash: #5eead414;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }
      body {
        font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: var(--canvas);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--accent); }

      header {
        display: flex; align-items: center; gap: 1.4rem;
        padding: 0.85rem 1.5rem;
        border-bottom: 1px solid var(--line);
      }
      header .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 1.15rem; text-decoration: none; color: var(--ink); }
      header .brand span { color: var(--accent); }
      header nav { margin-left: auto; display: flex; gap: 1.2rem; }
      header nav a { color: var(--muted); text-decoration: none; font-size: 0.94rem; }
      header nav a:hover { color: var(--accent); }

      main { flex: 1 0 auto; width: 100%; max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

      .hero { padding: 1.2rem 0 2rem; border-bottom: 1px solid var(--line); margin-bottom: 2.2rem; }
      .hero h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.03em; line-height: 1.08; }
      .hero .tagline { margin: 0.7rem 0 0; max-width: 46rem; color: var(--muted); font-size: 1.08rem; }
      .hero .meta { margin: 1rem 0 0; display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center; }
      .hero .meta .meta-item { font-size: 0.85rem; color: var(--faint); }
      .hero .meta .meta-item + .meta-item::before { content: "·"; margin-right: 0.75rem; color: var(--line); }
      .hero .meta a { color: var(--accent); text-decoration: none; }
      .hero .meta a:hover { text-decoration: underline; }

      .panel { margin: 0 0 2.4rem; }
      .panel > h2 { font-size: 1.15rem; letter-spacing: -0.01em; margin: 0 0 1rem; }

      .cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0.85rem; }
      .cards li a {
        display: block; height: 100%; padding: 1rem 1.15rem;
        border: 1px solid var(--line); border-radius: 10px; background: var(--canvas);
        color: var(--ink); text-decoration: none; font-weight: 600; box-shadow: var(--shadow);
        transition: border-color 0.12s ease, transform 0.12s ease;
      }
      .cards li a:hover { border-color: var(--accent); transform: translateY(-2px); color: var(--ink); }
      .cards li a::after { content: "→"; float: right; color: var(--faint); font-weight: 400; }

      .release { border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1.1rem; margin: 0 0 0.85rem; box-shadow: var(--shadow); }
      .release .version { font-weight: 700; }
      .release .date { color: var(--faint); font-size: 0.83rem; margin-left: 0.6rem; }
      .release .note { margin: 0.45rem 0 0; color: var(--muted); }

      .empty { color: var(--faint); }
      .notfound { max-width: 40rem; }

      footer {
        display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
        padding: 1.1rem 1.5rem; border-top: 1px solid var(--line);
        color: var(--faint); font-size: 0.9rem;
      }
      footer a { color: var(--faint); }
      footer .source { color: var(--muted); text-decoration: none; }
      footer .source:hover { color: var(--accent); text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Rho<span>.</span></a>
      <nav>
        <a href="/docs/">Documentation</a>
        <a href="/releases">Releases</a>
      </nav>
    </header>
