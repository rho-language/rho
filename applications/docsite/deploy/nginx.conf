# nginx in front of the Rho handbook service.
#
# In the ISPConfig walkthrough this file is not used directly: ISPConfig owns the
# vhost and its snippets. This is the plain-nginx equivalent, and the registry's
# docs/deployment.md applies unchanged apart from the name.

server {
    listen 443 ssl http2;
    server_name docs.rho-lang.org;

    ssl_certificate     /etc/letsencrypt/live/docs.rho-lang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.rho-lang.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
