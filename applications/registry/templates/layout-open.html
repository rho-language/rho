<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      /* Padding must be included in the viewport height, otherwise a short
         page still overflows by the body's top padding and the footer ends up
         below the fold. */
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        color-scheme: light dark;
        --doc: #0f766e;
        --doc-line: #0f766e55;
        --doc-wash: #0f766e14;
        --crumb-ink: #6b7278;
        --crumb-line: #e3e6ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --doc: #5eead4;
          --doc-line: #5eead455;
          --doc-wash: #5eead41a;
          --crumb-ink: #8b9299;
          --crumb-line: #2a3036;
        }
      }
      html, body { height: 100%; }
      body {
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0 auto;
        padding: 2rem 1.5rem 0;
        max-width: 56rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main { flex: 1 0 auto; }
      h1 { font-size: 1.35rem; margin: 0; }
      h2 { font-size: 1rem; margin: 2rem 0 0.6rem; font-weight: 600; }
      h3 { font-size: 0.95rem; margin: 1.6rem 0 0.4rem; font-weight: 600; }
      .sub { opacity: 0.65; margin: 0.3rem 0 1.4rem; }
      .bar { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
      form { display: flex; gap: 0.5rem; margin: 0 0 0.5rem; }
      input {
        flex: 1;
        padding: 0.5rem 0.65rem;
        border: 1px solid #8884;
        border-radius: 0.4rem;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 0.5rem 1.1rem;
        border: 0;
        border-radius: 0.4rem;
        background: #3b6ea5;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      ul { list-style: none; padding: 0; margin: 0; border: 1px solid #8883; border-radius: 0.5rem; overflow: hidden; }
      li { padding: 0.6rem 0.9rem; border-bottom: 1px solid #8882; display: flex; align-items: baseline; gap: 0.6rem; }
      li:last-child { border-bottom: 0; }
      .name { font-weight: 600; }
      .badge {
        font-size: 0.75rem;
        padding: 0.05rem 0.45rem;
        border: 1px solid #8885;
        border-radius: 0.7rem;
        opacity: 0.8;
      }
      .desc { opacity: 0.7; font-size: 0.9em; }
      /* The documentation marker. It has its own colour rather than the
         version badge's, so a listing reads at a glance: a grey badge is a
         version and a teal one is documentation. */
      .doc-badge {
        margin-left: auto;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.05rem 0.45rem;
        border-radius: 0.7rem;
        color: var(--doc);
        border: 1px solid var(--doc-line);
        background: var(--doc-wash);
      }
      .doc-badge:hover { border-color: var(--doc); text-decoration: none; filter: brightness(1.1); }
      .doc-link {
        display: inline-block;
        margin: 0.3rem 0;
        padding: 0.15rem 0.5rem;
        border: 1px solid var(--doc-line);
        border-radius: 0.4rem;
        color: var(--doc);
        background: var(--doc-wash);
      }
      .doc-link:hover { border-color: var(--doc); text-decoration: none; }
      .doc-none { opacity: 0.55; }
      .empty { opacity: 0.7; border: 1px dashed #8884; border-radius: 0.5rem; padding: 1rem 0.9rem; }
      /* The trail at the top of a page: small, and quiet enough to read past,
         with the parts that go back underlined on hover. */
      .crumb {
        margin: 0 0 1.1rem;
        padding-bottom: 0.5rem;
        font-size: 0.85rem;
        color: var(--crumb-ink);
        border-bottom: 1px solid var(--crumb-line);
      }
      .crumb a { color: var(--crumb-ink); }
      .crumb a:hover { color: var(--doc); }
      .crumb a + a::before, .crumb a + span::before { content: "/"; margin: 0 0.4rem; opacity: 0.5; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.35rem 1rem; margin: 0.5rem 0 0; }
      dt { opacity: 0.7; }
      dd { margin: 0; }
      code { background: #8881; padding: 0.05rem 0.3rem; border-radius: 0.25rem; }
      a { color: inherit; text-decoration: none; }
      a:hover .name { text-decoration: underline; }
      footer {
        flex: none;
        border-top: 1px solid #8883;
        margin-top: 2.5rem;
        padding: 1rem 0 1.5rem;
        opacity: 0.65;
        font-size: 0.85em;
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      footer a { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="bar">
        <h1><a href="/">{{ title }}</a></h1>
        <form method="get" action="/search">
          <input name="q" value="{{ query }}" placeholder="search modules" />
          <button type="submit">Search</button>
        </form>
      </div>
