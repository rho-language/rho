# Project descriptor for the Rho registry service.
#
# Overrides the built-in descriptor so the generated Go project also receives
# the filesystem store and documentation ports. The ports are generated by the
# compiler, so this project stays pure Rho: ports/store.go would otherwise have
# to be hand-written and shipped.
#
# The documentation port is what lets the service document a published module:
# the generator is a component, reached as a process, so the service that serves
# a module's pages and the build that wrote them are the same code. A host
# running the registry therefore needs the rho toolchain and the rho-doc
# component present, which the deployment notes cover.

version: 1

output_dir: build/generated
build_dir: build

targets:
  # A plain command-line build of the same sources. The service is the
  # go-server target, but the request logic is target independent, so this
  # target is what the Rho tests run on: a server target starts a listener,
  # which is not a test process.
  - id: go
    emitter: go
    kind: cli
    description: Registry logic as a command-line program
    ports:
      - docemit
      - fsstore
      - logemit
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build

  - id: go-server
    emitter: go
    kind: server
    description: Registry HTTP service
    # The routing port supplies the router, the typed parameter binding and the
    # middleware pipeline, all as generated Go. The standard library's ServeMux
    # carries the method-and-wildcard patterns these routes are declared with,
    # so the generated project routes its requests with nothing fetched.
    router: serveMux
    # What the registry says about itself, over and above what its routes say.
    #
    # Reading is public; publishing needs a publish token, and the handlers that
    # check one are the ones that say so. The scheme is declared here because a
    # description cannot derive what a credential is from a call in a body, and
    # the address a caller gets one from is the one thing no source records.
    api:
      security: bearer
      security_description: "A token in the Authorization header, obtained from POST /auth/token. Publishing always needs one; reading is public."
      public_paths: "/, /healthz"
    # Supplies the store_put/store_get/store_has/store_search externs the
    # handlers declare, the documentation generator the pages come from, and the
    # service's own API description.
    ports:
      - docemit
      - fsstore
      - logemit
      - openapiemit
    # A registry is read from a browser on another origin, so every request is
    # named before anything can be correlated with it, and a caller that floods
    # one route must not cost every other caller a request.
    middleware:
      - name: request_id
      - name: cors
        options:
          origin: "*"
      - name: rate_limit
        options:
          requests: "240"
          window: "1m"
    # Page markup, kept out of the Rho sources and rendered by the generated
    # template engine.
    templates:
      - name: layout-open
        file: templates/layout-open.html
      - name: layout-close
        file: templates/layout-close.html
      - name: index
        file: templates/index.html
      - name: row
        file: templates/row.html
      - name: version
        file: templates/version.html
      - name: detail
        file: templates/detail.html
      - name: empty
        file: templates/empty.html
      - name: notfound
        file: templates/notfound.html
      - name: crumb
        file: templates/crumb.html
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
