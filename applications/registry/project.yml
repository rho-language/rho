# Project descriptor for the Rho registry service.
#
# Overrides the built-in descriptor so the generated Go project also receives
# the filesystem store port. The port is generated by the compiler, so this
# project stays pure Rho: ports/store.go would otherwise have to be
# hand-written and shipped.

version: 1

output_dir: build/generated
build_dir: build

targets:
  # A plain command-line build of the same sources. The service is the
  # go-server target, but the request logic is target independent, so this
  # target is what the Rho tests run on: a server target starts a listener,
  # which is not a test process.
  - id: go
    emitter: go
    kind: cli
    description: Registry logic as a command-line program
    ports:
      - fsstore
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build

  - id: go-server
    emitter: go
    kind: server
    description: Registry HTTP service
    # Supplies the store_put/store_get/store_has/store_search externs the
    # handlers declare.
    ports:
      - fsstore
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
