# nginx in front of the Rho module registry.
#
# In the ISPConfig walkthrough this file is not used directly: ISPConfig owns the
# vhost and its snippets. See the ISPConfig section of docs/deployment.md for the
# snippet to paste into the site's nginx directives. This file is the plain-nginx
# equivalent.
#
# The service binds 127.0.0.1 when this is in place, so the port stays private
# and only TLS traffic is public.

server {
    listen 443 ssl http2;
    server_name registry.example.com;

    ssl_certificate     /etc/letsencrypt/live/registry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.example.com/privkey.pem;

    # Must be at least the registry's max_upload_mb, or nginx refuses an upload
    # the service would have accepted. The service's HTTP body ceiling is derived
    # from max_upload_mb too, so this is the only other place to keep in step.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
