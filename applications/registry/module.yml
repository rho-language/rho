module:
  name: registry
  type: rho
  version: 0.1.0
description: Remote module registry for Rho
main: src/main.rho

build:
  # A registry only makes sense as a service, so it generates the Go server
  # target alone and has no native build.
  language: go
  targets:
    - go-server

# The application logs its own domain events: a publish accepted or refused, a
# download served or missed. The service manager already collects the process's
# own records, so these are the ones worth keeping in an application log.
deps:
  rho-log: ">=0.1.0"

# The registry documents itself: the sources below ship with the application, so
# the deployment notes a reader needs travel with the code that is deployed.
docs:
  title: Remote module registry for Rho
  section: applications
  order: "10"
  index: docs/index.md
  sources:
    - docs/index.md
    - docs/deployment.md
