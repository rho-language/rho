module:
  name: registry
  type: rho
  version: 0.1.0
description: Remote module registry for Rho
main: src/main.rho

build:
  # A registry only makes sense as a service, so it generates the Go server
  # target alone and has no native build.
  language: go
  targets:
    - go-server

# The application logs its own domain events: a publish accepted or refused, a
# download served or missed. The service manager already collects the process's
# own records, so these are the ones worth keeping in an application log.
deps:
  rho-log: ">=0.1.0"
